<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | DAO Essence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background decorative shapes */
        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 80%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 60%;
            height: 80%;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.08) 0%, rgba(10, 10, 10, 0.03) 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo svg {
            width: 180px;
            height: auto;
        }

        /* Card */
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 32px;
        }

        /* Social buttons */
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            border: 1.5px solid #e5e5e5;
            border-radius: 12px;
            background: #ffffff;
            color: #1a1a1a;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .social-btn:hover {
            border-color: #d4af37;
            background: #fafafa;
            transform: translateY(-1px);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }

        /* Email form */
        .email-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e5e5e5;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
            color: #1a1a1a;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #d4af37;
        }

        .input-field::placeholder {
            color: #999;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #c4a030 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        /* Terms */
        .terms {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .terms a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        /* Footer links */
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .footer a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
            margin: 0 8px;
        }

        .footer a:hover {
            color: #d4af37;
        }

        /* Loading state */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            color: #666;
            font-size: 14px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e5e5e5;
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Back to home */
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            z-index: 2;
        }

        .back-link:hover {
            color: #1a1a1a;
        }

        .back-link svg {
            width: 20px;
            height: 20px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            .card-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Home
    </a>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 200 40" fill="none">
                <circle cx="20" cy="20" r="18" fill="#1a1a1a"/>
                <text x="16" y="26" fill="#d4af37" font-size="20" font-weight="700">道</text>
                <text x="48" y="28" fill="#1a1a1a" font-size="22" font-weight="700" font-family="Inter">DAO</text>
                <text x="92" y="28" fill="#1a1a1a" font-size="22" font-weight="400" font-family="Inter">Essence</text>
            </svg>
        </div>

        <!-- Card -->
        <div class="card">
            <h1 class="card-title">Sign in to DAO Essence</h1>

            <!-- Social Buttons -->
            <div class="social-buttons">
                <button class="social-btn" id="google-signin">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <button class="social-btn" id="email-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                    Continue with Email
                </button>
            </div>

            <div class="divider">or</div>

            <!-- Email Form -->
            <form class="email-form" id="email-form">
                <input type="email" class="input-field" placeholder="Email address" required>
                <input type="password" class="input-field" placeholder="Password" required>
                <button type="submit" class="submit-btn">Continue</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                Signing in...
            </div>

            <!-- Terms -->
            <p class="terms">
                By continuing, you agree to DAO Essence's<br>
                <a href="/terms" target="_blank">Terms of Service</a> and
                <a href="/privacy" target="_blank">Privacy Policy</a>
            </p>
        </div>

        <!-- Footer -->
        <div class="footer">
            <a href="/contact">Need help?</a> ·
            <a href="/forgot-password">Forgot password?</a>
        </div>
    </div>

    <!-- Clerk Scripts -->
    <script defer crossorigin="anonymous" src="https://decent-glider-58.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"></script>
    <script defer crossorigin="anonymous" src="https://decent-glider-58.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js" data-clerk-publishable-key="pk_test_ZGVjZW50LWdsaWRlci01OC5jbGVyay5hY2NvdW50cy5kZXYk"></script>

    <script>
        // Initialize Clerk
        async function initClerk() {
            while (!window.Clerk || !window.__internal_ClerkUICtor) {
                await new Promise(r => setTimeout(r, 100));
            }

            await window.Clerk.load({
                ui: { ClerkUI: window.__internal_ClerkUICtor }
            });

            const clerk = window.Clerk;

            // Google Sign In (Clerk v6: API is on client.signIn)
            document.getElementById('google-signin').addEventListener('click', () => {
                clerk.client.signIn.authenticateWithRedirect({
                    strategy: 'oauth_google',
                    redirectUrl: window.location.origin + '/wallpaper',
                    redirectUrlComplete: window.location.origin + '/wallpaper'
                });
            });

            // Scroll to email form
            document.getElementById('email-btn').addEventListener('click', () => {
                document.getElementById('email-form').scrollIntoView({ behavior: 'smooth' });
                document.querySelector('.input-field').focus();
            });

            // Email form submit
            document.getElementById('email-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const loading = document.getElementById('loading');
                const form = e.target;
                const email = form.querySelector('input[type="email"]').value;
                const password = form.querySelector('input[type="password"]').value;

                loading.classList.add('active');
                form.style.display = 'none';

                try {
                    await clerk.client.signIn.create({
                        identifier: email,
                        password: password
                    });
                    window.location.href = '/wallpaper';
                } catch (err) {
                    alert('Sign in failed: ' + err.message);
                    loading.classList.remove('active');
                    form.style.display = 'flex';
                }
            });

            // If already signed in, redirect
            if (clerk.isSignedIn) {
                window.location.href = '/wallpaper';
            }
        }

        initClerk();
    </script>
</body>
</html>
