<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Wallpaper - Dao Essentia</title>
    <meta name="description" content="Download high-resolution Lucky Wallpaper.">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Lucky Wallpaper - Dao Essentia">
    <meta property="og:description" content="Curated collection of high-resolution auspicious wallpapers.">
    <meta property="og:image" content="">
    <meta property="og:url" content="">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #D4AF37;
            --bg-dark: #0a0a12;
            --text-light: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --radius-lg: 24px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Blurred Background */
        #bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.5);
            transform: scale(1.2);
            z-index: -1;
            transition: background-image 0.5s ease;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            z-index: 10;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Scrollable Content */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* View Toggle (Tabs) */
        .view-toggle {
            display: flex;
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 4px;
            gap: 4px;
        }
        .toggle-btn {
            padding: 8px 20px;
            border-radius: 26px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-btn.active {
            background: var(--primary-gold);
            color: #000;
        }

        /* Wallpaper Card */
        .wallpaper-card {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            padding: 20px 0;
        }

        .wallpaper-card img {
            max-width: 90vw;  /* Fit within screen width */
            max-height: 80vh; /* Fit within screen height */
            width: auto;
            height: auto;
            object-fit: contain; /* Maintain original aspect ratio */
            display: block;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease;
        }

        /* Info Panel */
        .info-panel {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .wp-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .wp-desc {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        /* Tags */
        .wp-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tag {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-dim);
        }

        /* Download Button */
        .btn-download {
            width: 100%;
            max-width: 320px;
            height: 56px;
            border-radius: 28px;
            background: linear-gradient(135deg, #D4AF37 0%, #AA8A26 100%);
            color: #000;
            font-weight: 700;
            font-size: 16px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 20px;
        }
        .btn-download svg { width: 20px; height: 20px; }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .nav-btn:disabled { opacity: 0.3; }

        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div id="bg-blur"></div>

    <div class="top-bar">
        <a href="wallpaper.html" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="icon-btn" id="share-btn">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
        </div>
    </div>

    <div class="content-area">
        <!-- View Toggle -->
        <div class="view-toggle">
            <button class="toggle-btn active" id="btn-wallpaper">Wallpaper</button>
            <button class="toggle-btn" id="btn-mockup">Mockup</button>
        </div>

        <!-- Image Card -->
        <div class="wallpaper-card">
            <div class="loading">Loading...</div>
            <img id="main-image" style="display:none;" />
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1 class="wp-title" id="wp-title">Lucky Wallpaper</h1>
            <p class="wp-desc" id="wp-desc">Enhance your device's Feng Shui energy with this high-resolution lucky wallpaper.</p>
            
            <!-- Tags -->
            <div class="wp-tags" id="wp-tags"></div>

            <a href="#" class="btn-download" id="download-link" download>
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Download HD Wallpaper
            </a>

            <div class="bottom-nav">
                <button class="nav-btn" id="prev-btn">Prev</button>
                <button class="nav-btn" id="next-btn">Next</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let wallpaperId = urlParams.get('id');
        let wallpapers = [];
        let currentIndex = -1;
        let currentView = 'wallpaper'; 

        async function init() {
            try {
                const res = await fetch('wallpapers.json?t=' + new Date().getTime());
                wallpapers = await res.json();
                
                if (wallpaperId) {
                    const index = wallpapers.findIndex(w => w.id === wallpaperId);
                    if (index !== -1) render(index);
                    else window.location.href = 'wallpaper.html';
                } else if (wallpapers.length > 0) {
                    render(0);
                }
            } catch (e) { console.error(e); }
        }

        function render(index) {
            currentIndex = index;
            const data = wallpapers[index];
            wallpaperId = data.id;

            const img = document.getElementById('main-image');
            const bg = document.getElementById('bg-blur');
            const title = document.getElementById('wp-title');
            const desc = document.getElementById('wp-desc');
            const tagsContainer = document.getElementById('wp-tags');
            const dlLink = document.getElementById('download-link');

            // Update Image Source based on View
            const currentSrc = currentView === 'mockup' ? (data.mockup || data.original) : data.original;
            img.src = currentSrc;
            img.onload = () => {
                document.querySelector('.loading').style.display = 'none';
                img.style.display = 'block';
            };

            // Update Background
            bg.style.backgroundImage = `url(${data.original})`;

            // Update Text
            title.textContent = data.title || 'Lucky Wallpaper';
            desc.textContent = data.description || "Curated collection of high-resolution auspicious wallpapers. Enhance your device with the energy of BaZi and Five Elements.";

            // Update Tags
            tagsContainer.innerHTML = '';
            if (data.tags && data.tags.length > 0) {
                data.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = tag;
                    tagsContainer.appendChild(span);
                });
            }

            // Update Download Link
            dlLink.href = currentSrc;

            // SEO & OG Tags
            document.title = `${data.title} - Lucky Wallpaper | Dao Essentia`;
            document.querySelector('meta[name="description"]').content = desc.textContent;
            document.querySelector('meta[property="og:image"]').content = data.original;
            document.querySelector('meta[property="og:url"]').content = window.location.href;

            // Nav State
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === wallpapers.length - 1;
        }

        // Toggle Logic
        document.getElementById('btn-wallpaper').onclick = function() {
            currentView = 'wallpaper';
            this.classList.add('active');
            document.getElementById('btn-mockup').classList.remove('active');
            document.getElementById('download-link').innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Download HD Wallpaper`;
            if (currentIndex !== -1) render(currentIndex);
        };

        document.getElementById('btn-mockup').onclick = function() {
            currentView = 'mockup';
            this.classList.add('active');
            document.getElementById('btn-wallpaper').classList.remove('active');
            document.getElementById('download-link').innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Download Mockup Preview`;
            if (currentIndex !== -1) render(currentIndex);
        };

        document.getElementById('prev-btn').onclick = () => {
            if (currentIndex > 0) {
                render(currentIndex - 1);
                window.history.pushState(null, null, `?id=${wallpapers[currentIndex - 1].id}`);
            }
        };
        document.getElementById('next-btn').onclick = () => {
            if (currentIndex < wallpapers.length - 1) {
                render(currentIndex + 1);
                window.history.pushState(null, null, `?id=${wallpapers[currentIndex + 1].id}`);
            }
        };

        document.getElementById('share-btn').onclick = () => {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Link copied!');
            }
        };

        init();
    </script>
</body>
</html>
