<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Wallpaper - Dao Essentia</title>
    <meta name="description" content="Download high-resolution Lucky Wallpaper.">

    <!-- Open Graph -->
    <meta property="og:title" content="Lucky Wallpaper - Dao Essentia">
    <meta property="og:description" content="Curated collection of high-resolution auspicious wallpapers.">
    <meta property="og:image" content="">
    <meta property="og:url" content="">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #D4AF37;
            --gold-dark: #AA8A26;
            --bg: #0a0a0a;
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --text-muted: rgba(255,255,255,0.3);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ── Top Bar ── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .top-bar-left, .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            text-decoration: none;
            transition: background 0.2s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.15); }
        .icon-btn svg { width: 20px; height: 20px; }
        .back-btn svg { fill: none; stroke: currentColor; stroke-width: 2; }
        .share-btn svg { fill: currentColor; }
        .download-btn-sm svg { fill: none; stroke: currentColor; stroke-width: 2; }

        /* ── Main Content ── */
        .main-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        /* ── Image — ZEDGE style: no frame, no shadow, full width ── */
        .preview-image {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #111;
        }
        .preview-image img {
            width: 100%;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ── View Toggle (Original / Mockup) — KEPT ── */
        .view-toggle {
            display: none;
            margin-top: 16px;
            justify-content: center;
        }
        .view-toggle.visible { display: flex; }
        .toggle-group {
            display: flex;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toggle-btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-dim);
            transition: all 0.2s;
        }
        .toggle-btn:hover { color: var(--text); }
        .toggle-btn.active {
            background: rgba(255,255,255,0.12);
            color: var(--text);
        }

        /* ── Info Section (ZEDGE flow: date → H1 → downloads → tags) ── */
        .info-section {
            margin-top: 24px;
        }

        /* Date + Creator line */
        .wp-date-line {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* Title */
        .wp-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        /* Downloads */
        .wp-downloads {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .wp-downloads svg {
            width: 14px;
            height: 14px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
        }

        /* Description */
        .wp-desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* Tags */
        .wp-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }
        .tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
            cursor: pointer;
        }
        .tag:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
            color: var(--text);
        }

        /* ── Download Button (ZEDGE style: big, prominent) ── */
        .btn-download {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 16px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(212,175,55,0.3);
        }
        .btn-download:active { transform: scale(0.98); }
        .btn-download svg { width: 20px; height: 20px; fill: #0a0a0a; }

        /* ── Share Row ── */
        .share-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }
        .share-icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
        }
        .share-icon-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .share-icon-btn svg { width: 18px; height: 18px; }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 40px 0;
        }

        /* ── Related — KEPT ── */
        .related-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .related-card {
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            aspect-ratio: 9/16;
            background: #111;
        }
        .related-card:hover { transform: translateY(-3px); }
        .related-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* ── Loading ── */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 500px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .preview-image { border-radius: 12px; }
            .wp-title { font-size: 20px; }
            .related-grid { gap: 8px; }
            .btn-download { height: 48px; font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="wallpaper.html" class="icon-btn back-btn">
                <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </a>
        </div>
        <div class="top-bar-right">
            <a href="#" class="icon-btn download-btn-sm" id="download-btn-top" download>
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </a>
            <button class="icon-btn share-btn" id="share-btn-top">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="main-content">
        <!-- Image (ZEDGE: no frame/shadow) -->
        <div class="preview-image">
            <div class="loading" id="loading-text">Loading...</div>
            <img id="main-image" style="display:none;" />
        </div>

        <!-- View Toggle (Original / Mockup) — KEPT -->
        <div class="view-toggle" id="view-toggle">
            <div class="toggle-group">
                <button class="toggle-btn active" data-view="original" id="toggle-original">Original</button>
                <button class="toggle-btn" data-view="mockup" id="toggle-mockup">Preview on Device</button>
            </div>
        </div>

        <!-- Info (ZEDGE flow: date → H1 → downloads → desc → tags) -->
        <div class="info-section">
            <div class="wp-date-line" id="wp-date"></div>
            <h1 class="wp-title" id="wp-title">Lucky Wallpaper</h1>
            <div class="wp-downloads" id="wp-downloads"></div>
            <div class="wp-desc" id="wp-desc"></div>
            <div class="wp-tags" id="wp-tags"></div>
        </div>

        <!-- Download Button (ZEDGE: big, full-width) -->
        <a href="#" class="btn-download" id="download-link" download>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span id="download-text">Download</span>
        </a>

        <!-- Share Row -->
        <div class="share-row">
            <button class="share-icon-btn" id="share-btn-main">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Related — KEPT -->
        <h2 class="related-title" id="related-title">More Wallpapers</h2>
        <div class="related-grid" id="related-grid"></div>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        const CONFIG = { relatedCount: 6 };

        const urlParams = new URLSearchParams(window.location.search);
        let wallpaperId = urlParams.get('id');
        let wallpapers = [];
        let currentIndex = -1;
        let currentView = 'original';

        async function init() {
            try {
                const res = await fetch('wallpapers.json?t=' + new Date().getTime());
                wallpapers = await res.json();

                if (wallpaperId) {
                    const index = wallpapers.findIndex(w => w.id === wallpaperId);
                    if (index !== -1) render(index);
                    else window.location.href = 'wallpaper.html';
                } else if (wallpapers.length > 0) {
                    render(0);
                }
            } catch (e) { console.error(e); }
        }

        function render(index) {
            currentIndex = index;
            const data = wallpapers[index];
            wallpaperId = data.id;

            const img = document.getElementById('main-image');
            const loading = document.getElementById('loading-text');

            // Image
            currentView = 'original';
            img.src = data.thumb;
            img.onload = () => {
                loading.style.display = 'none';
                img.style.display = 'block';
            };

            // View toggle
            const toggle = document.getElementById('view-toggle');
            if (data.mockup) {
                toggle.classList.add('visible');
            } else {
                toggle.classList.remove('visible');
            }

            // Date line (ZEDGE: "2026 May 31" style)
            const dateEl = document.getElementById('wp-date');
            if (data.date) {
                dateEl.textContent = new Date(data.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            } else {
                dateEl.textContent = '';
            }

            // Title
            document.getElementById('wp-title').textContent = data.title || 'Lucky Wallpaper';

            // Downloads
            const dlEl = document.getElementById('wp-downloads');
            if (data.downloads) {
                dlEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> ${data.downloads} downloads`;
            } else {
                dlEl.innerHTML = '';
            }

            // Description
            const descEl = document.getElementById('wp-desc');
            if (data.tags && data.tags.length > 0) {
                descEl.textContent = data.tags.join(', ');
            } else {
                descEl.textContent = '';
            }

            // Tags
            const tagsEl = document.getElementById('wp-tags');
            tagsEl.innerHTML = '';
            if (data.category) {
                const catTag = document.createElement('span');
                catTag.className = 'tag';
                catTag.textContent = data.category;
                tagsEl.appendChild(catTag);
            }
            if (data.tags && data.tags.length > 0) {
                data.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = tag;
                    tagsEl.appendChild(span);
                });
            }

            // Download
            document.getElementById('download-link').href = data.original;
            document.getElementById('download-btn-top').href = data.original;

            // SEO
            document.title = `${data.title} - Lucky Wallpaper | Dao Essentia`;
            document.querySelector('meta[name="description"]').content = `Download ${data.title} - high-resolution lucky wallpaper from Dao Essentia.`;
            document.querySelector('meta[property="og:image"]').content = data.thumb;
            document.querySelector('meta[property="og:url"]').content = window.location.href;

            // Related
            renderRelated(index);
        }

        // View toggle (original / mockup)
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.onclick = () => {
                const view = btn.dataset.view;
                if (view === currentView) return;
                currentView = view;

                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const data = wallpapers[currentIndex];
                const img = document.getElementById('main-image');
                if (view === 'mockup' && data.mockup) {
                    img.src = data.mockup;
                } else {
                    img.src = data.thumb;
                }
            };
        });

        // Related
        function renderRelated(currentIndex) {
            const grid = document.getElementById('related-grid');
            grid.innerHTML = '';

            const related = wallpapers
                .filter((_, i) => i !== currentIndex)
                .slice(0, CONFIG.relatedCount);

            related.forEach(wp => {
                const card = document.createElement('div');
                card.className = 'related-card';
                card.innerHTML = `<img src="${wp.thumb}" alt="${wp.title || 'Wallpaper'}" loading="lazy">`;
                card.onclick = () => {
                    window.location.href = `wallpaper-detail.html?id=${wp.id}`;
                };
                grid.appendChild(card);
            });
        }

        // Share
        function doShare() {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Link copied!');
            }
        }
        document.getElementById('share-btn-top').onclick = doShare;
        document.getElementById('share-btn-main').onclick = doShare;

        init();
    </script>
</body>
</html>
