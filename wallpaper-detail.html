<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Wallpaper - Dao Essentia</title>
    <meta name="description" content="Download high-resolution Lucky Wallpaper.">

    <!-- Open Graph -->
    <meta property="og:title" content="Lucky Wallpaper - Dao Essentia">
    <meta property="og:description" content="Curated collection of high-resolution auspicious wallpapers.">
    <meta property="og:image" content="">
    <meta property="og:url" content="">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --bg-dark: #121212;
            --bg-card: #1a1a1a;
            --text-light: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --text-secondary: rgba(255, 255, 255, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            z-index: 100;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            text-decoration: none;
            transition: background 0.2s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Detail Layout: Left Image, Right Info */
        .detail-layout {
            display: flex;
            gap: 32px;
            align-items: flex-start;
        }

        /* Left: Wallpaper Preview */
        .wallpaper-preview {
            flex: 1;
            display: flex;
            justify-content: center;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            min-height: 500px;
        }

        .wallpaper-preview img {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        /* Right: Info Panel */
        .info-panel {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 8px;
        }

        .wp-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            line-height: 1.3;
        }

        /* Tags */
        .wp-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-dim);
            transition: background 0.2s;
        }
        .tag:hover { background: rgba(255,255,255,0.12); }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-download {
            flex: 1;
            height: 48px;
            border-radius: 24px;
            background: linear-gradient(135deg, #D4AF37 0%, #AA8A26 100%);
            color: #000;
            font-weight: 700;
            font-size: 15px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-download svg { width: 18px; height: 18px; }

        .btn-share {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
        }
        .btn-share:hover { background: rgba(255,255,255,0.2); }
        .btn-share svg { width: 20px; height: 20px; fill: currentColor; }

        /* Related Section */
        .related-section {
            margin-top: 48px;
        }

        .related-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 20px;
            color: var(--text-light);
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .related-card {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            aspect-ratio: 9/16;
            background: var(--bg-card);
        }
        .related-card:hover { transform: scale(1.05); }
        .related-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: var(--text-dim);
            font-size: 14px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .detail-layout {
                flex-direction: column;
                gap: 20px;
            }
            .wallpaper-preview {
                min-height: 300px;
                border-radius: 12px;
            }
            .info-panel {
                width: 100%;
            }
            .related-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="wallpaper.html" class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="icon-btn" id="share-btn">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
        </div>
    </div>

    <div class="main-content">
        <!-- Detail Layout -->
        <div class="detail-layout">
            <!-- Left: Wallpaper Preview -->
            <div class="wallpaper-preview">
                <div class="loading" id="loading-text">Loading...</div>
                <img id="main-image" style="display:none;" />
            </div>

            <!-- Right: Info Panel -->
            <div class="info-panel">
                <h1 class="wp-title" id="wp-title">Lucky Wallpaper</h1>
                <div class="wp-tags" id="wp-tags"></div>

                <div class="action-buttons">
                    <a href="#" class="btn-download" id="download-link" download>
                        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        Download
                    </a>
                    <button class="btn-share" id="share-btn-inline">
                        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Related Wallpapers -->
        <div class="related-section">
            <h2 class="related-title">Related</h2>
            <div class="related-grid" id="related-grid"></div>
        </div>
    </div>

    <script>
        // 配置区
        const CONFIG = {
            relatedCount: 8,   // 相关推荐展示数量
            cacheBust: true
        };

        const urlParams = new URLSearchParams(window.location.search);
        let wallpaperId = urlParams.get('id');
        let wallpapers = [];
        let currentIndex = -1;

        async function init() {
            try {
                const res = await fetch('wallpapers.json?t=' + new Date().getTime());
                wallpapers = await res.json();

                if (wallpaperId) {
                    const index = wallpapers.findIndex(w => w.id === wallpaperId);
                    if (index !== -1) render(index);
                    else window.location.href = 'wallpaper.html';
                } else if (wallpapers.length > 0) {
                    render(0);
                }
            } catch (e) { console.error(e); }
        }

        function render(index) {
            currentIndex = index;
            const data = wallpapers[index];
            wallpaperId = data.id;

            const img = document.getElementById('main-image');
            const loading = document.getElementById('loading-text');
            const title = document.getElementById('wp-title');
            const tagsContainer = document.getElementById('wp-tags');
            const dlLink = document.getElementById('download-link');

            // Image: WebP for fast loading
            img.src = data.thumb;
            img.onload = () => {
                loading.style.display = 'none';
                img.style.display = 'block';
            };

            // Title
            title.textContent = data.title || 'Lucky Wallpaper';

            // Tags
            tagsContainer.innerHTML = '';
            if (data.tags && data.tags.length > 0) {
                data.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = tag;
                    tagsContainer.appendChild(span);
                });
            }

            // Download Link: PNG HD original
            dlLink.href = data.original;

            // SEO & OG
            document.title = `${data.title} - Lucky Wallpaper | Dao Essentia`;
            document.querySelector('meta[name="description"]').content = `Download ${data.title} - high-resolution lucky wallpaper from Dao Essentia.`;
            document.querySelector('meta[property="og:image"]').content = data.original;
            document.querySelector('meta[property="og:url"]').content = window.location.href;

            // Related Wallpapers
            renderRelated(index);
        }

        function renderRelated(currentIndex) {
            const grid = document.getElementById('related-grid');
            grid.innerHTML = '';

            const related = wallpapers
                .filter((_, i) => i !== currentIndex)
                .slice(0, CONFIG.relatedCount);

            related.forEach(wp => {
                const card = document.createElement('div');
                card.className = 'related-card';
                card.innerHTML = `<img src="${wp.thumb}" alt="${wp.title || 'Wallpaper'}" loading="lazy">`;
                card.onclick = () => {
                    window.location.href = `?id=${wp.id}`;
                };
                grid.appendChild(card);
            });
        }

        // Share
        function doShare() {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Link copied!');
            }
        }

        document.getElementById('share-btn').onclick = doShare;
        document.getElementById('share-btn-inline').onclick = doShare;

        init();
    </script>
</body>
</html>
