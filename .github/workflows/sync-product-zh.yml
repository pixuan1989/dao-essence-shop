name: Sync Product ZH Translations

# 解决 Vercel 构建时商品中文翻译缓存（i18n/product-zh-map.json）不持久化的问题：
# 每次 Vercel 部署都是全新 clone，旧缓存丢失 → 所有商品被重新翻译 → 重复烧 DashScope token。
# 本 workflow 在 push 到 main 后，用 GitHub 原生 token 把翻译结果提交回仓库，
# 使 Vercel 部署永远读到“满缓存”，零重复翻译。
# 安全性：GitHub 原生 GITHUB_TOKEN 的 push 默认不会触发新的 workflow run，天然防循环；
# 且 sync 脚本为增量逻辑——无新增商品时不产生改动，不会空转提交。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync product translations (incremental)
        run: node --input-type=module -e "import('./scripts/sync-product-zh.mjs').then(m => m.syncProductTranslations())"

      - name: Commit & push if cache changed
        run: |
          git add i18n/product-zh-map.json
          if git diff --cached --quiet; then
            echo "ℹ️ No new translations — cache already complete, nothing to push."
          else
            git commit -m "[cache-sync] auto-sync product zh translations"
            git push
            echo "✅ Pushed updated product-zh-map.json — future Vercel deploys will skip these translations."
          fi
