# Fallback 每日运势生成 + 部署
# 当 WorkBuddy 本地定时任务失败时，此 workflow 作为云端备份
# 触发条件：
#   1. 每日 02:00 UTC (10:00 北京时间) 定时触发
#   2. 手动触发（workflow_dispatch）

name: Daily Horoscope Fallback

on:
  schedule:
    # 每日 02:00 UTC = 10:00 北京时间（比 WorkBuddy 晚 8 小时，作为备份）
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '生成日期 (YYYY-MM-DD)，留空则使用今天'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    # 跳过条件：如果今天已有 commit 包含 "daily horoscope update"，说明 WorkBuddy 已成功执行
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check if WorkBuddy already ran today
        if: ${{ github.event_name == 'schedule' }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LAST_COMMIT=$(git log -1 --pretty=%B)
          if echo "$LAST_COMMIT" | grep -q "daily horoscope update.*$TODAY\|$TODAY.*daily horoscope"; then
            echo "✅ WorkBuddy 已成功执行今日部署，跳过 fallback"
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          else
            echo "⚠️  未检测到今日 WorkBuddy 部署记录，启动 fallback"
            echo "SKIP_DEPLOY=false" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        run: npm install

      - name: Generate daily horoscope
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        run: |
          TARGET_DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date -u +%Y-%m-%d)
          fi
          echo "生成日期: $TARGET_DATE"
          node scripts/generate-daily.js "$TARGET_DATE"

      - name: Update cache version on aggregate page
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        run: |
          TARGET_DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date -u +%Y-%m-%d)
          fi
          CACHE_VERSION=$(echo "$TARGET_DATE" | tr -d '-')
          sed -i "s|<script src=\"js/zodiac-data.js\"|<script src=\"js/zodiac-data.js?v=${CACHE_VERSION}\"|g" zodiac/zodiac-daily.html
          echo "✅ 缓存版本已更新: ?v=$CACHE_VERSION"

      - name: Commit and push changes
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zodiac/zodiac-daily.html zodiac/js/zodiac-data.js zodiac/seo-content/*.json zodiac/*.html
          if ! git diff --cached --quiet; then
            TARGET_DATE="${{ github.event.inputs.date || '' }}"
            if [ -z "$TARGET_DATE" ]; then
              TARGET_DATE=$(date -u +%Y-%m-%d)
            fi
            git commit -m "chore: ${TARGET_DATE} daily horoscope update (GitHub Actions fallback)"
            git push origin main
            echo "✅ Fallback 部署成功"
          else
            echo "⚠️  无文件变更，跳过提交"
          fi

      - name: Notify on failure
        if: ${{ failure() && env.SKIP_DEPLOY != 'true' }}
        run: |
          echo "::error::GitHub Actions fallback 部署失败！"
          echo "请检查："
          echo "  1. DASHSCOPE_API_KEY secret 是否已配置"
          echo "  2. WorkBuddy 是否正常运行"
          echo "  3. 网络连接是否正常"
