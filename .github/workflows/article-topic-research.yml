name: Article Topic Research (manual only)

on:
  # 每日定时选题+推企业微信已停用（2026-08-25，避免空耗 DASHSCOPE token）
  # 如需恢复，取消下面注释并重新启用工作流：
  # schedule:
  #   - cron: '0 23 * * *'
  workflow_dispatch:  # 手动触发（保留，便于按需运行）

jobs:
  topic-research:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      
      - name: Run topic scraper
        run: python scripts/topic_scraper.py
      
      - name: Generate topic candidates
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python scripts/topic_generator.py
      
      - name: Send WeChat notification
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          python scripts/wechat_notify.py
      
      - name: Upload topic data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: topic-data
          path: topic_data/
          retention-days: 7
