name: Inject Real Users to Queue
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Sent Records & Inject Users
        env:
          URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # 1. 清除已发送记录（避免 isAlreadySent 跳过补发）
          curl -s -X POST "$URL/DEL/sent_auto_replies" \
            -H "Authorization: Bearer $TOKEN"
          echo "✅ 已清除 sent_auto_replies"

          # 2. 注入测试用户（sendAfter 设为过去时间，立即触发）
          PAST_TIME="2026-06-12T00:00:00Z"
          DATA='[
            {"id":"real_66666","email":"517748938@qq.com","name":"66666","birthYear":"1992","birthMonth":"01","birthDay":"17","birthHour":"1","dominantElement":"earth","ganzhi":"Xinwei","zodiac":"Goat","yearPillar":"Xinwei","monthPillar":"Xinchou","dayPillar":"Guiyou","hourPillar":"Guichou","dayMaster":"Gui","source":"wuxing_quiz","sendAfter":"'$PAST_TIME'","createdAt":"2026-06-12T00:00:00Z"}
          ]'

          curl -s -X POST "$URL/SET/pending_auto_reply" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$DATA"

          echo "✅ 成功注入 1 个测试用户 (517748938@qq.com)，可立即发送。"