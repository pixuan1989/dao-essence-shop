name: Inject Real Users to Queue
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Inject Users
        env:
          URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # 直接覆盖写入正确的数据格式，不再读取旧数据
          PAST_TIME="2026-06-12T00:00:00Z"
          DATA='[
            {"id":"real_schay","email":"chay.sipha@gmail.com","name":"Schay","birthYear":"1972","birthMonth":"09","birthDay":"21","birthHour":"-1","dominantElement":"wood","source":"wuxing_quiz","sendAfter":"'$PAST_TIME'","createdAt":"2026-06-12T00:00:00Z"},
            {"id":"real_kn","email":"conkayen@gmail.com","name":"KN","birthYear":"1989","birthMonth":"09","birthDay":"12","birthHour":"17","dominantElement":"wood","source":"wuxing_quiz","sendAfter":"'$PAST_TIME'","createdAt":"2026-06-12T00:00:00Z"}
          ]'
          
          curl -s -X POST $URL/SET/pending_auto_reply \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$DATA"
            
          echo "✅ 成功注入 2 个真实用户。"