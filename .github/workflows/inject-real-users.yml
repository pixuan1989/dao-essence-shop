name: Inject Real Users to Queue
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Sent Records & Inject Users
        env:
          URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # 1. 清除已发送记录（避免 isAlreadySent 跳过补发）
          curl -s -X POST "$URL/DEL/sent_auto_replies" \
            -H "Authorization: Bearer $TOKEN"
          echo "✅ 已清除 sent_auto_replies"

          # 2. 注入测试用户（sendAfter 设为过去时间，立即触发）
          PAST_TIME="2026-06-12T00:00:00Z"
          DATA='[
            {"id":"real_schay","email":"chay.sipha@gmail.com","name":"Schay","birthYear":"1972","birthMonth":"09","birthDay":"21","birthHour":"-1","dominantElement":"wood","ganzhi":"Renzi","zodiac":"Rat","yearPillar":"Renzi","monthPillar":"JiYou","dayPillar":"YiSi","hourPillar":"BingZi","dayMaster":"Yi","source":"wuxing_quiz","sendAfter":"'$PAST_TIME'","createdAt":"2026-06-12T00:00:00Z"},
            {"id":"real_kn","email":"conkayen@gmail.com","name":"KN","birthYear":"1989","birthMonth":"09","birthDay":"12","birthHour":"17","dominantElement":"wood","ganzhi":"Jisi","zodiac":"Snake","yearPillar":"Jisi","monthPillar":"GuiYou","dayPillar":"DingMao","hourPillar":"DingWei","dayMaster":"Ding","source":"wuxing_quiz","sendAfter":"'$PAST_TIME'","createdAt":"2026-06-12T00:00:00Z"}
          ]'

          curl -s -X POST "$URL/SET/pending_auto_reply" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$DATA"

          echo "✅ 成功注入 2 个真实用户，可立即补发。"