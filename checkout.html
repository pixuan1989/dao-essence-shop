<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | DAO Essence</title>
    <meta name="description" content="Complete your purchase of DAO Essence Taoist digital resources. Secure checkout with instant delivery.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Analytics -->
    <script>
      // 内部流量 Cookie 屏蔽（最彻底：完全不发送任何 GA 请求）
      // 设定：控制台执行 document.cookie='ga_internal=1;path=/;max-age=31536000'
      // 取消：控制台执行 document.cookie='ga_internal=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT'
      if (document.cookie.indexOf('ga_internal=1') > -1) {
        window['ga-disable-G-FX0T6YB6DE'] = true;
      }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FX0T6YB6DE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // 自动检测内部流量（localhost / 内网 IP）→ 排除不计入 GA
      (function() {
        const host = window.location.hostname;
        const isInternal = host === 'localhost' || host === '127.0.0.1' ||
                          host.startsWith('192.168.') || host.startsWith('10.') ||
                          /^172\.(1[6-9]|2[0-9]|3[01])\./.test(host);
        gtag('config', 'G-FX0T6YB6DE', {
          traffic_type: isInternal ? 'internal' : 'external'
        });
      })();
    </script>
</head>
<body>
    <!-- 直接购买模式：静默跳转到 Creem 支付页，无任何 UI -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const isDirectMode = urlParams.get('mode') === 'direct';

            if (isDirectMode) {
                const orderData = sessionStorage.getItem('directOrder');
                if (orderData) {
                    processDirectCheckout(JSON.parse(orderData));
                } else {
                    window.location.href = 'shop.html';
                }
                return;
            }

            // 非直接购买模式：跳转到 Shop 页面（旧订单页已废弃）
            window.location.href = 'shop.html';
        })();

        async function processDirectCheckout(orderData) {
            try {
                const response = await fetch('/api/create-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                const data = await response.json();
                const checkoutUrl = data.checkoutUrl || data.checkout_url || data.url;
                if (checkoutUrl) {
                    window.location.replace(checkoutUrl);
                } else {
                    console.error('No checkout URL:', data);
                    window.location.href = 'shop.html';
                }
            } catch (error) {
                console.error('Checkout error:', error);
                window.location.href = 'shop.html';
            }
        }
    </script>
</body>
</html>
