<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日生肖运势 | DaoEssentia</title>
  <link rel="stylesheet" href="css/zodiac-daily.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

  <!-- ══ 宇宙大背景 ══ -->
  <div class="cosmos-bg" id="cosmosBg">
    <!-- 顶部光芒 -->
    <div class="cosmos-glow-top"></div>
    <!-- 底部光芒 -->
    <div class="cosmos-glow-bottom"></div>

    <!-- 占星环 -->
    <div class="zodiac-wheel">
      <div class="wheel-ring"></div>
      <div class="wheel-ring-2"></div>
      <div class="wheel-ring-3"></div>
      <div class="wheel-deco"></div>
    </div>

    <!-- 占星符号点缀（十二地支） -->
    <div class="zodiac-symbol" style="top:4%;left:50%;transform:translateX(-50%)">子</div>
    <div class="zodiac-symbol" style="top:15%;left:85%">丑</div>
    <div class="zodiac-symbol" style="top:38%;left:96%">寅</div>
    <div class="zodiac-symbol" style="top:60%;left:88%">卯</div>
    <div class="zodiac-symbol" style="top:80%;left:68%">辰</div>
    <div class="zodiac-symbol" style="top:90%;left:42%">巳</div>
    <div class="zodiac-symbol" style="top:88%;left:15%">午</div>
    <div class="zodiac-symbol" style="top:72%;left:3%">未</div>
    <div class="zodiac-symbol" style="top:48%;left:0%">申</div>
    <div class="zodiac-symbol" style="top:25%;left:3%">酉</div>
    <div class="zodiac-symbol" style="top:8%;left:18%">戌</div>
    <div class="zodiac-symbol" style="top:3%;left:38%">亥</div>

    <!-- 大型装饰星 -->
    <div style="position:absolute;top:18%;left:12%;font-size:1.1rem;color:rgba(212,175,55,0.12);">✧</div>
    <div style="position:absolute;top:35%;right:8%;font-size:0.8rem;color:rgba(212,175,55,0.1);">✦</div>
    <div style="position:absolute;bottom:28%;left:8%;font-size:0.9rem;color:rgba(212,175,55,0.08);">✧</div>
    <div style="position:absolute;bottom:12%;right:15%;font-size:1rem;color:rgba(212,175,55,0.1);">✦</div>
    <div style="position:absolute;top:55%;right:5%;font-size:0.7rem;color:rgba(212,175,55,0.09);">✧</div>
  </div>

  <!-- 星空粒子 -->
  <div class="starfield" id="starfield"></div>

  <!-- ══ 页面内容 ══ -->
  <div class="page-wrapper">

    <header class="page-header">
      <h1 class="page-header__title">今日生肖运势</h1>
      <div class="header-date" id="headerDate"></div>
    </header>

    <div class="card-grid" id="cardGrid"></div>

  </div>

  <script src="js/zodiac-data.js"></script>
  <script>
    (function() {
      // ── 日期 ──
      var today = new Date();
      var y = today.getFullYear();
      var m = String(today.getMonth() + 1).padStart(2, '0');
      var d = String(today.getDate()).padStart(2, '0');
      var dateStr = y + '-' + m + '-' + d;
      var wk = ['周日','周一','周二','周三','周四','周五','周六'];
      document.getElementById('headerDate').textContent =
        y + '年' + m + '月' + d + '日 · ' + wk[today.getDay()];

      // ── 找出当日运势最佳生肖 ──
      var dayData = getDayData(dateStr);
      var bestSign = '';
      var bestScore = -1;
      ZODIAC_SIGNS.forEach(function(meta) {
        if (dayData[meta.key].score > bestScore) {
          bestScore = dayData[meta.key].score;
          bestSign = meta.key;
        }
      });

      // ── 渲染 12 卡片 ──
      var grid = document.getElementById('cardGrid');

      // ── 已有插图的生肖（插图补齐后统一更新这里）──
      var haveImages = ['rat','ox','tiger','rabbit','dragon','snake','horse','goat','monkey','rooster','dog','pig'];

      ZODIAC_SIGNS.forEach(function(meta) {
        var data = dayData[meta.key];
        var el = document.createElement('div');
        el.className = 'zodiac-card';

        var isBest = meta.key === bestSign;

        var imageArea;
        if (haveImages.indexOf(meta.key) !== -1) {
          // 真实插图
          imageArea = '<img class="card-img" src="images/' + meta.key + '.webp" alt="' + meta.name + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">';
          imageArea += '<div class="card-placeholder" style="display:none">' + meta.emoji + '</div>';
        } else {
          // 色块占位（等插图补齐后加入 images/）
          imageArea = '<div class="card-placeholder">' + meta.emoji + '</div>';
        }

        el.innerHTML = [
          isBest ? '<span class="zodiac-badge">✦ 运势最佳 ✦</span>' : '',
          '<div class="card-image-area">',
            imageArea,
          '</div>',
          '<div class="card-info">',
            '<div class="card-name">' + meta.name + '</div>',
            '<div class="card-meta">',
              '<span class="card-stars">' + renderStars(data.score) + '</span>',
              '<span class="card-color-dot" style="background:' + data.color + ';box-shadow:0 0 6px ' + data.color + '"></span>',
              '<span class="card-score">' + data.score + '分</span>',
            '</div>',
            '<div class="card-line"></div>',
          '</div>'
        ].join('');

        el.addEventListener('click', function() {
          window.location.href = 'zodiac-detail.html?sign=' + meta.key + '&date=' + dateStr;
        });

        grid.appendChild(el);
      });

      // ── 星空粒子 ──
      var sf = document.getElementById('starfield');
      for (var i = 0; i < 110; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        var sz = (Math.random() * 2 + 0.5).toFixed(2);
        s.style.cssText = [
          'width:' + sz + 'px;height:' + sz + 'px;',
          'left:' + (Math.random()*100).toFixed(1) + '%;',
          'top:'  + (Math.random()*100).toFixed(1) + '%;',
          '--dur:' + (Math.random()*5+2).toFixed(1) + 's;',
          '--lo:'  + (Math.random()*0.12).toFixed(2) + ';',
          '--hi:'  + (Math.random()*0.5+0.35).toFixed(2)
        ].join('');
        sf.appendChild(s);
      }

    })();
  </script>

</body>
</html>
