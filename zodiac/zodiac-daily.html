  <!-- Wallpapers Section (Bottom) - Build Time Injection -->
  <section class="container" style="margin-bottom:40px;">
    <div id="zodiac-wp-rec-container" style="text-align:center; padding:30px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:16px;">
      <h3 style="font-size:18px;color:#D4AF37;margin-bottom:20px;">今日生肖幸运壁纸</h3>
      <div id="zodiac-wp-grid" style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;"></div>
      <a href="/wallpaper" style="display:inline-block;margin-top:20px;padding:10px 24px;background:rgba(212,175,55,0.15);color:#D4AF37;border:1px solid rgba(212,175,55,0.3);border-radius:8px;text-decoration:none;font-size:14px;">查看更多玄学壁纸 →</a>
    </div>
  </section>

  <!-- Inline Wallpaper Script (No External File, No Cache Issues) -->
  <script>
  (function() {
    // 调试：显示在网页上
    var container = document.getElementById('zodiac-wp-rec-container');
    var grid = document.getElementById('zodiac-wp-grid');
    
    function showStatus(msg, color) {
      if (!container) return;
      var div = document.createElement('div');
      div.style.cssText = 'color:' + (color || '#fff') + ';font-size:14px;margin:10px 0;';
      div.textContent = msg;
      container.appendChild(div);
    }

    showStatus('[调试] 脚本开始运行...', '#fff');

    fetch('/wallpapers.json')
      .then(function(res) {
        showStatus('[调试] 请求发送完毕，状态码：' + res.status, res.ok ? '#4ade80' : 'red');
        if (!res.ok) {
          showStatus('[错误] 网络请求失败', 'red');
          return;
        }
        return res.json();
      })
      .then(function(wps) {
        if (!wps) return;
        showStatus('[调试] 成功获取 ' + wps.length + ' 张壁纸', '#4ade80');
        
        if (!wps.length) {
          showStatus('[警告] 壁纸数据为空', 'orange');
          return;
        }

        // 随机选 3 张
        var picks = wps.sort(function() { return 0.5 - Math.random(); }).slice(0, 3);
        showStatus('[调试] 已选取 3 张，开始渲染...', '#4ade80');

        picks.forEach(function(wp) {
          var a = document.createElement('a');
          a.href = '/wallpaper/' + (wp.slug || wp.id);
          a.style.cssText = 'display:block;width:110px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);transition:transform 0.2s;';
          
          var thumb = wp.thumb || '';
          if (!thumb) {
            showStatus('[警告] 壁纸 ' + wp.id + ' 缺少 thumb 字段', 'orange');
          }
          
          a.innerHTML = '<img src="' + thumb + '" style="width:100%;display:block;min-height:150px;background:#333;" loading="lazy" onerror="this.style.display=\'none\'" />';
          a.onmouseenter = function() { a.style.transform = 'translateY(-4px)'; };
          a.onmouseleave = function() { a.style.transform = ''; };
          grid.appendChild(a);
        });

        showStatus('[成功] 壁纸渲染完毕！', '#4ade80');
      })
      .catch(function(e) {
        showStatus('[报错] ' + e.message, 'red');
        console.error('[Zodiac Wallpaper]', e);
      });
  })();
  </script>
