<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>生肖运势 · DaoEssentia</title>
  <meta property="og:type" content="website">

  <!--
    ★ 生肖每日运势 · 详情页 v6 — 左右分栏布局（无emoji）
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    项目代号：zodiac-daily
    如需回滚删除整个项目：删除 zodiac/ 目录即可
  -->
  <link rel="stylesheet" href="css/zodiac-daily.css">
  <script src="../js/tool-share.js" defer></script>

  <!-- 12 生肖渐变背景（JS 根据 sign 设置） -->
  <script>
    var ZODIAC_BG = {
      rat:     'linear-gradient(165deg, #0a1628, #102a43, #163e5f, #1a4a6b)',
      ox:      'linear-gradient(160deg, #071a12, #0d2818, #143d26, #1a5035)',
      tiger:   'linear-gradient(155deg, #1a0c08, #2d1408, #401808, #551c08)',
      rabbit:  'linear-gradient(170deg, #180a14, #280e20, #38122c, #481638)',
      dragon:  'linear-gradient(150deg, #1a1400, #332200, #4d3000, #663e00)',
      snake:   'linear-gradient(160deg, #12081a, #1c0c30, #261046, #30145c)',
      horse:   'linear-gradient(155deg, #1a0608, #33090c, #4c0c10, #650f14)',
      goat:    'linear-gradient(175deg, #14141a, #20202c, #2c2c3e, #383850)',
      monkey:  'linear-gradient(162deg, #061418, #0c242c, #123440, #184454)',
      rooster: 'linear-gradient(168deg, #1a1008, #331c10, #4d2818, #663420)',
      dog:     'linear-gradient(172deg, #121210, #1e201c, #2a2e28, #363c34)',
      pig:     'linear-gradient(158deg, #14081a, #240e30, #341446, #441a5c)'
    };
    var ZODIACCOLORS = {
      rat:'#D4AF37', ox:'#5B8299', tiger:'#B8665E', rabbit:'#5E825E', dragon:'#FFD54F',
      snake:'#8B5CF6', horse:'#B8665E', goat:'#FFFFFF', monkey:'#00E5FF',
      rooster:'#C084FC', dog:'#9E8E6E', pig:'#5B8299'
    };

    (function(){
      var params = new URLSearchParams(location.search);
      var s = params.get('sign') || 'dragon';
      var el = document.createElement('style');
      el.textContent = '.detail-bg{background:'+(ZODIAC_BG[s]||ZODIAC_BG.dragon)+'}';
      document.head.appendChild(el);
    })();
  </script>
</head>

<body class="detail-page-body">

  <!-- 背景 -->
  <div class="detail-bg"></div>

  <!-- ═══ 顶栏 ═══ -->
  <header class="detail-nav">
    <a class="detail-nav__back" href="zodiac-daily.html">← 返回运势首页</a>
  </header>

  <!-- ═══ 内容层 ═══ -->
  <main class="detail-content-v5">

    <!-- 日期 -->
    <div class="detail-date-badge" id="dateBadge"></div>

    <!-- ━━━━ 左右布局 ━━━━ -->
    <div class="detail-layout">

      <!-- 左侧：插图 -->
      <div class="detail-layout__left">
        <div class="detail-card-left">
          <img class="detail-card-left__img" id="cardImg" alt="">
          <div class="detail-card-left__glow"></div>
        </div>
      </div>

      <!-- 右侧：信息 -->
      <div class="detail-layout__right">
        <div class="detail-header">
          <h1 class="detail-header__name" id="cardName"></h1>
          <div class="detail-header__score">
            <span class="detail-header__score-num" id="cardScore"></span>
            <span class="detail-header__stars" id="cardStars"></span>
          </div>
        </div>

        <!-- ━━━━ 关键信息 ━━━━ -->
        <div class="detail-info-row" id="infoRow"></div>

        <!-- ━━━━ 宜忌 ━━━━ -->
        <div class="detail-yiji" id="yijiRow"></div>

        <!-- ━━━━ 金句 ━━━━ -->
        <blockquote class="detail-quote">
          <p id="quoteText"></p>
        </blockquote>
      </div>
    </div>

    <!-- ━━━━ 分享栏 ━━━━ -->
    <div id="zodiac-share"></div>

    <!-- ━━━━ 分割线 + SEO 文本区 ━━━━ -->
    <div class="seo-divider">
      <span class="seo-divider__line"></span>
      <span class="seo-divider__text">今日运势解读</span>
      <span class="seo-divider__line"></span>
    </div>

    <article class="seo-content" id="seoContent">
      <h2>今日<span id="seoSignName"></span>运势详解</h2>
      <p id="seoText">运势解读内容将由每日引擎生成，此处为占位文本。每次更新可自动生成独立页面内容，提升搜索引擎收录权重。</p>
    </article>

    <!-- ━━━━ FAQ 模块 ━━━━ -->
    <script type="application/ld+json" id="faqJsonLd"></script>
    <section class="faq-section" id="faqSection">
      <div class="faq-section__header">
        <h2 class="faq-section__title">常见问题</h2>
        <p class="faq-section__subtitle">关于<span id="faqSignName"></span>今日运势的常见问题</p>
      </div>
      <div class="faq-list" id="faqList"></div>
    </section>

    <!-- ━━━━ 博客导流 ━━━━ -->
    <section class="blog-links-section" id="blogLinksSection">
      <div class="blog-links-section__header">
        <h2 class="blog-links-section__title">相关阅读</h2>
        <p class="blog-links-section__subtitle">深入了解更多命理知识</p>
      </div>
      <div class="blog-links-list" id="blogLinksList"></div>
    </section>

  </main>

  <script src="js/zodiac-data.js"></script>
  <script>
    (function() {
      var params = new URLSearchParams(location.search);
      var sign   = params.get('sign') || 'dragon';
      var dateStr = params.get('date') || new Date().toISOString().split('T')[0];

      var dayData = getDayData(dateStr);
      var data = dayData[sign];
      if (!data) { alert('暂无该生肖数据'); location.href='zodiac-daily.html'; return; }

      var meta = null;
      for (var i=0;i<ZODIAC_SIGNS.length;i++) { if(ZODIAC_SIGNS[i].key===sign){meta=ZODIAC_SIGNS[i];break;} }
      if (!meta) return;

      var accent = ZODIACCOLORS[sign] || '#D4AF37';

      // 日期
      var d = dateStr.split('-');
      var wk = ['周日','周一','周二','周三','周四','周五','周六'];
      var dt = new Date(parseInt(d[0]),parseInt(d[1])-1,parseInt(d[2]));
      document.getElementById('dateBadge').textContent = d[0]+'年'+d[1]+'月'+d[2]+'日 · '+wk[dt.getDay()];

      // 卡片插图
      var img = document.getElementById('cardImg');
      img.src = 'images/' + sign + '.webp';
      img.alt = meta.name;
      img.onerror = function() { this.style.display='none'; };

      // 卡片文字（无 emoji）
      document.getElementById('cardName').textContent = meta.name;
      document.getElementById('cardScore').textContent = data.score;
      document.getElementById('cardStars').textContent = renderStars(data.score);
      document.getElementById('cardScore').style.color = accent;

      // 关键信息
      document.getElementById('infoRow').innerHTML =
        '<div class="info-chip"><span class="dot" style="background:'+data.color+'"></span>幸运色 <strong>'+data.colorName+'</strong></div>' +
        '<div class="info-chip">幸运数 <strong>'+data.number+'</strong></div>' +
        '<div class="info-chip">方位 <strong>'+data.direction+'</strong></div>';

      // 宜忌
      var goodTags='', badTags='';
      data.good.forEach(function(g){ goodTags+='<span class="y-tag y-tag--good">'+g+'</span>'; });
      data.avoid.forEach(function(a){ badTags+='<span class="y-tag y-tag--bad">'+a+'</span>'; });
      document.getElementById('yijiRow').innerHTML =
        '<div class="yiji-block yiji-block--good"><div class="yiji-block__hdr">宜</div><div class="yiji-block__tags">'+goodTags+'</div></div>' +
        '<div class="yiji-block yiji-block--bad"><div class="yiji-block__hdr">忌</div><div class="yiji-block__tags">'+badTags+'</div></div>';

      // 金句
      document.getElementById('quoteText').textContent = data.quote;

      // SEO 占位
      document.getElementById('seoSignName').textContent = meta.name;

      // 分享栏（统一使用 tool-share.js）
      var shareText = meta.name + '今日运势 ' + data.score + '分 — ' + data.quote;
      if (window.ToolShare) {
        window.ToolShare.render('zodiac-share', {
          label: '分享你的运势',
          text: shareText
        });
      }

      // ── 渲染 FAQ 模块 ──
      var faqSignNameEl = document.getElementById('faqSignName');
      if (faqSignNameEl) faqSignNameEl.textContent = meta.name;

      // FAQ 数据模板（基于当日 fortune 数据填充）
      var verdictMapCN = {
        '上升': '运势上升',
        '降低': '运势降低',
        '一般': '运势一般',
        '喜忧参半': '喜忧参半',
        '稳定': '运势稳定',
      };
      var faqData = [
        {
          q: meta.name + '今日运势如何？',
          a: meta.name + '今日运势' + (verdictMapCN[data.verdict] || data.verdict) + '，综合评分 ' + data.score + '/100。幸运数字 ' + data.number + '，幸运方位 ' + data.direction + '，幸运色 ' + data.colorName + '。宜' + data.good.join('、') + '，忌' + data.avoid.join('、') + '。'
        },
        {
          q: meta.name + '今日事业工作运势好吗？',
          a: '根据天干地支五行推算，今日' + meta.name + '的工作运势受' + (data.verdict === '上升' ? '吉星扶助，适合主动出击' : data.verdict === '降低' ? '不利因素较多，宜静不宜动' : '平稳推进，按计划行事') + '。建议' + (data.good[0] ? '今日宜' + data.good[0] : '保持专注') + '。'
        },
        {
          q: meta.name + '今日财运/爱情运势如何？',
          a: '今日' + meta.name + '的整体能量' + (verdictMapCN[data.verdict] || data.verdict) + '，具体运势详见上方详细解读。综合建议：' + data.quote + '。配合幸运数字 ' + data.number + ' 和幸运方位 ' + data.direction + ' 行动，效果更佳。'
        }
      ];

      // JSON-LD Schema
      var jsonLd = {
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        'mainEntity': faqData.map(function(f) {
          return {
            '@type': 'Question',
            'name': f.q,
            'acceptedAnswer': {
              '@type': 'Answer',
              'text': f.a
            }
          };
        })
      };
      var ldEl = document.getElementById('faqJsonLd');
      if (ldEl) ldEl.textContent = JSON.stringify(jsonLd);

      // 可见 FAQ 内容
      var faqListEl = document.getElementById('faqList');
      if (faqListEl) {
        var html = '';
        faqData.forEach(function(faq) {
          html += '<details class="faq-item">' +
            '<summary class="faq-item__q">' + faq.q + '</summary>' +
            '<div class="faq-item__a">' + faq.a + '</div>' +
          '</details>';
        });
        faqListEl.innerHTML = html;
      }

      // ── 渲染博客导流（根据页面语言自动切换中英文）──
      var pageLang = document.documentElement.lang || 'zh-Hant';
      var blogLinks = pageLang.startsWith('zh') ? (data.blogLinksCN || []) : (data.blogLinksEN || []);
      var blogLinksEl = document.getElementById('blogLinksList');
      if (blogLinksEl && blogLinks.length > 0) {
        var blogHtml = '';
        blogLinks.forEach(function(link) {
          blogHtml += '<a href="' + link.url + '" class="blog-link-card">' +
            '<div class="blog-link-card__icon">📖</div>' +
            '<div class="blog-link-card__content">' +
              '<div class="blog-link-card__title">' + link.title + '</div>' +
              '<div class="blog-link-card__arrow">→</div>' +
            '</div>' +
          '</a>';
        });
        blogLinksEl.innerHTML = blogHtml;
        var blogSection = document.getElementById('blogLinksSection');
        if (blogSection) blogSection.style.display = 'block';
      } else if (blogLinksEl) {
        var blogSection = document.getElementById('blogLinksSection');
        if (blogSection) blogSection.style.display = 'none';
      }

      // ── 加载SEO解读内容 ──
      fetch('seo-content/' + dateStr + '.json')
        .then(function(r) { return r.json(); })
        .then(function(json) {
          var fc = json.fortunes && json.fortunes[sign];
          if (fc && fc.content) {
            document.getElementById('seoText').textContent = fc.content;
          }
        })
        .catch(function() { /* 静默失败，保留占位文本 */ });
    })();


  </script>

</body>
</html>
