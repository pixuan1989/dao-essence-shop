  <!-- 12 生肖渐变背景（JS 根据 sign 设置） -->
  <script>
    var ZODIAC_BG = {
      rat:     'linear-gradient(165deg, #0a1628, #102a43, #163e5f, #1a4a6b)',
      ox:      'linear-gradient(160deg, #071a12, #0d2818, #143d26, #1a5035)',
      tiger:   'linear-gradient(155deg, #1a0c08, #2d1408, #401808, #551c08)',
      rabbit:  'linear-gradient(170deg, #180a14, #280e20, #38122c, #481638)',
      dragon:  'linear-gradient(150deg, #1a1400, #332200, #4d3000, #663e00)',
      snake:   'linear-gradient(160deg, #12081a, #1c0c30, #261046, #30145c)',
      horse:   'linear-gradient(155deg, #1a0608, #33090c, #4c0c10, #650f14)',
      goat:    'linear-gradient(175deg, #14141a, #20202c, #2c2c3e, #383850)',
      monkey:  'linear-gradient(162deg, #061418, #0c242c, #123440, #184454)',
      rooster: 'linear-gradient(168deg, #1a1008, #331c10, #4d2818, #663420)',
      dog:     'linear-gradient(172deg, #121210, #1e201c, #2a2e28, #363c34)',
      pig:     'linear-gradient(158deg, #14081a, #240e30, #341446, #441a5c)'
    };
    var ZODIACCOLORS = {
      rat:'#D4AF37', ox:'#5B8299', tiger:'#B8665E', rabbit:'#5E825E', dragon:'#FFD54F',
      snake:'#8B5CF6', horse:'#B8665E', goat:'#FFFFFF', monkey:'#00E5FF',
      rooster:'#C084FC', dog:'#9E8E6E', pig:'#5B8299'
    };

    (function(){
      var params = new URLSearchParams(location.search);
      var s = params.get('sign') || 'dragon';
      var el = document.createElement('style');
      el.textContent = '.detail-bg{background:'+(ZODIAC_BG[s]||ZODIAC_BG.dragon)+'}';
      document.head.appendChild(el);
    })();
  </script>
</head>

<body class="detail-page-body">

  <!-- 背景 -->
  <div class="detail-bg"></div>

  <!-- ═══ 顶栏 ═══ -->

  <!-- ═══ 内容层 ═══ -->

    <!-- ━━━━ 左右布局 ━━━━ -->

      <!-- 右侧：信息 -->
      <div class="detail-layout__right">
        <div class="detail-header">
          <h1 class="detail-header__name" id="cardName"></h1>
          <div class="detail-header__score">
            <span class="detail-header__score-num" id="cardScore"></span>
            <span class="detail-header__stars" id="cardStars"></span>
          </div>

        <!-- ━━━━ 关键信息 ━━━━ -->

    <!-- ━━━━ 分享栏 ━━━━ -->

    <!-- ━━━━ 分割线 + SEO 文本区 ━━━━ -->

      <span class="seo-divider__line"></span>
    </div>

    <article class="seo-content" id="seoContent">
      <h2 id="seoTitle">今日<span id="seoSignName"></span>运势详解</h2>
      <p id="seoText">运势解读内容将由每日引擎生成，此处为占位文本。每次更新可自动生成独立页面内容，提升搜索引擎收录权重。</p>
    </article>

    <!-- ━━━━ FAQ 模块 ━━━━ -->
    <script type="application/ld+json" id="faqJsonLd"></script>
    <section class="faq-section" id="faqSection">

        <h2 class="faq-section__title" id="faqTitle">常见问题</h2>

      </div>

    </section>

    <!-- ━━━━ 博客导流 ━━━━ -->

      <div class="blog-links-section__header">

        <p class="blog-links-section__subtitle" id="blogSubtitle">深入了解更多命理知识</p>
      </div>
      <div class="blog-links-list" id="blogLinksList"></div>
    </section>

  </main>

  <script src="js/zodiac-data.js"></script>
  <script>
    (function() {
      var params = new URLSearchParams(location.search);
      var sign   = params.get('sign') || 'dragon';
      var today = new Date();
      var y = today.getFullYear();
      var m = String(today.getMonth() + 1).padStart(2, '0');
      var d = String(today.getDate()).padStart(2, '0');
      var dateStr = params.get('date') || (y + '-' + m + '-' + d);
      var pageLang = params.get('lang') || localStorage.getItem('daoessence_lang') || 'zh';

      var dayData = getDayData(dateStr);
      var data = dayData[sign];
      if (!data) { alert('暂无该生肖数据'); location.href='zodiac-daily.html'; return; }

      var meta = null;
      for (var i=0;i<ZODIAC_SIGNS.length;i++) { if(ZODIAC_SIGNS[i].key===sign){meta=ZODIAC_SIGNS[i];break;} }
      if (!meta) return;

      var accent = ZODIACCOLORS[sign] || '#D4AF37';
      var isEn = pageLang === 'en';

      // ── 中英文映射表 ──
      var SIGN_NAMES_EN = {rat:'Rat',ox:'Ox',tiger:'Tiger',rabbit:'Rabbit',dragon:'Dragon',snake:'Snake',horse:'Horse',goat:'Goat',monkey:'Monkey',rooster:'Rooster',dog:'Dog',pig:'Pig'};
      var WEEKDAYS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var DIRECTION_EN = {正南:'South',正北:'North',正东:'East',正西:'West',东南:'Southeast',东北:'Northeast',西南:'Southwest',西北:'Northwest'};
      var COLOR_EN = {红色:'Red',绿色:'Green',蓝色:'Blue',黄色:'Yellow',紫色:'Purple',橙色:'Orange',白色:'White',黑色:'Black',粉色:'Pink',金色:'Gold',银色:'Silver',棕色:'Brown'};
      var VERDICT_EN = {'上升':'Rising','稳定':'Stable','一般':'Neutral','降低':'Declining'};
      var VERDICT_DESC_EN = {
        '上升': 'Blessed by auspicious stars—take the initiative.',
        '降低': 'Multiple unfavorable factors—stay low and avoid risks.',
        '一般': 'Steady progress—follow your plan.',
        '稳定': 'Stable energy—maintain your current pace.'
      };
      var YIJI_MAP = {
        '祈福':'Prayer', '祭祀':'Worship',
        '出行':'Travel', '会友':'Socializing',
        '求职':'Job Hunting', '签约':'Signing Contracts',
        '修身':'Self-Cultivation', '学习':'Study',
        '开业':'Business Opening', '表白':'Express Love',
        '文艺':'Arts & Culture', '创作':'Creation',
        '求财':'Wealth', '拜访':'Visiting',
        '嫁娶':'Marriage', '创新':'Innovation',
        '变革':'Transformation', '理财':'Finance',
        '储蓄':'Saving', '社交':'Socializing',
        '聚会':'Gathering', '休养':'Rest',
        '家庭':'Family', '搬家':'Moving',
        '沐浴':'Bathing', '动土':'Groundbreaking',
        '安葬':'Funeral', '借贷':'Borrowing',
        '谈判':'Negotiation', '投资':'Investment',
        '合伙':'Partnership', '诉讼':'Litigation',
        '迁徙':'Relocation', '争斗':'Quarrel',
        '口舌':'Gossip', '安床':'Bed Placement',
        '投机':'Speculation', '赌博':'Gambling',
        '冒进':'Recklessness', '变动':'Major Changes',
        '消费':'Spending', '扩张':'Expansion',
        '争执':'Dispute', '冲突':'Conflict'
      };
      var QUOTE_MAP = {
        '静待时机，贵人暗助。':'Patience rewards; unseen allies help.',
        '稳中求进，忌急躁。':'Advance steadily; avoid impatience.',
        '机遇临门，乘势而上。':'Opportunity arrives; ride the wave.',
        '韬光养晦，厚积薄发。':'Nurture your light; burst forth when ready.',
        '龙腾四海，气势如虹。':'Dragon soars the world; unstoppable force.',
        '灵蛇蜕皮，焕然一新。':'Shed old skin like a snake; emerge renewed.',
        '马到成功，势不可挡。':'Victory comes swiftly; nothing can stop you.',
        '温顺待机，贵人相助。':'Stay gentle and wait; benefactors appear.',
        '猴王智慧，灵活制胜。':'Monkey King wisdom; flexibility wins.',
        '守成为上，稳扎稳打。':'Hold your ground; steady wins the race.',
        '忠诚待人，福报自来。':'Loyalty to others brings its own blessings.',
        '猪拱福门，平安是福。':'Peace and safety are life\'s greatest fortune.',
        '虎啸山林，王者归来。':'Tiger roars in the forest; the king returns.',
        '贵人相扶，小有斩获。':'Benefactors assist; small gains come.',
        '稳中带进，时来运转。':'Steady progress; fortune turns your way.',
        '静待时机，蓄势待发。':'Wait for the right moment; gather strength.',
        '桃花运佳，感情得意。':'Peach blossom luck is strong; love flourishes.',
        '龙行虎步，一路顺风。':'Walk like dragon and tiger; smooth sailing ahead.',
        '静心养性，稳步前行。':'Cultivate inner peace; advance steadily.',
        '马有远志，循序渐进。':'The horse has great ambition; advance step by step.',
        '三合吉星，诸事顺遂。':'Triple harmony stars shine; all goes well.',
        '灵活变通，化解阻碍。':'Stay flexible; dissolve obstacles.',
        '精打细算，积少成多。':'Count every penny; small sums grow great.',
        '狗年大旺，人缘爆棚。':'Dog year brings great fortune; popularity soars.',
        '平安是福，知足常乐。':'Peace is a blessing; contentment brings joy.',
        '风雨过后见彩虹。':'After the storm comes the rainbow.'
      };
      function trYi(tag) { return isEn ? (YIJI_MAP[tag] || tag) : tag; }
      function trQuote(q) { return isEn ? (QUOTE_MAP[q] || q) : q; }

      // 运势判定（根据分数）
      var verdict = data.score >= 80 ? '上升' : data.score >= 60 ? '稳定' : data.score >= 50 ? '一般' : '降低';

      // 日期
      var d = dateStr.split('-');
      var dt = new Date(parseInt(d[0]),parseInt(d[1])-1,parseInt(d[2]));
      if (isEn) {
        document.getElementById('dateBadge').textContent = MONTHS_EN[dt.getMonth()] + ' ' + dt.getDate() + ', ' + d[0] + ' · ' + WEEKDAYS_EN[dt.getDay()];
      } else {
        var wk = ['周日','周一','周二','周三','周四','周五','周六'];
        document.getElementById('dateBadge').textContent = d[0]+'年'+d[1]+'月'+d[2]+'日 · '+wk[dt.getDay()];
      }

      // 卡片插图
      var img = document.getElementById('cardImg');
      img.src = 'images/' + sign + '.webp';
      img.alt = isEn ? SIGN_NAMES_EN[sign] : meta.name;
      img.onerror = function() { this.style.display='none'; };

      // 卡片文字（无 emoji）
      document.getElementById('cardName').textContent = isEn ? SIGN_NAMES_EN[sign] : meta.name;
      document.getElementById('cardScore').textContent = data.score;
      document.getElementById('cardStars').textContent = renderStars(data.score);
      document.getElementById('cardScore').style.color = accent;

      // 关键信息
      var colorLabel = isEn ? 'Lucky Color' : '幸运色';
      var numLabel   = isEn ? 'Lucky Number' : '幸运数';
      var dirLabel   = isEn ? 'Direction' : '方位';
      var colorEn = COLOR_EN[data.colorName] || data.colorName;
      var dirEn = DIRECTION_EN[data.direction] || data.direction;
      document.getElementById('infoRow').innerHTML =
        '<div class="info-chip"><span class="dot" style="background:'+data.color+'"></span>'+colorLabel+' <strong>'+(isEn?colorEn:data.colorName)+'</strong></div>' +
        '<div class="info-chip">'+numLabel+' <strong>'+data.number+'</strong></div>' +
        '<div class="info-chip">'+dirLabel+' <strong>'+(isEn?dirEn:data.direction)+'</strong></div>';

      // 宜忌
      var yiLabel = isEn ? 'Good for' : '宜';
      var jiLabel = isEn ? 'Avoid' : '忌';
      var goodTags='', badTags='';
      data.good.forEach(function(g){ goodTags+='<span class="y-tag y-tag--good">'+trYi(g)+'</span>'; });
      data.avoid.forEach(function(a){ badTags+='<span class="y-tag y-tag--bad">'+trYi(a)+'</span>'; });
      document.getElementById('yijiRow').innerHTML =
        '<div class="yiji-block yiji-block--good"><div class="yiji-block__hdr">'+yiLabel+'</div><div class="yiji-block__tags">'+goodTags+'</div></div>' +
        '<div class="yiji-block yiji-block--bad"><div class="yiji-block__hdr">'+jiLabel+'</div><div class="yiji-block__tags">'+badTags+'</div></div>';

      // 金句
      document.getElementById('quoteText').textContent = trQuote(data.quote);

      // SEO 占位
      document.getElementById('seoSignName').textContent = isEn ? SIGN_NAMES_EN[sign] : meta.name;

      // 分享栏（统一使用 tool-share.js）
      var shareText = meta.name + '今日运势 ' + data.score + '分 — ' + trQuote(data.quote);
      if (isEn) {
        shareText = 'Today\'s ' + (SIGN_NAMES_EN[sign] || sign) + ' Chinese zodiac horoscope: ' + data.score + '/100. Lucky number ' + data.number + ', direction ' + (DIRECTION_EN[data.direction]||data.direction) + ', lucky color ' + (COLOR_EN[data.colorName]||data.colorName) + '. Good for ' + data.good.map(trYi).join(', ') + '. Avoid ' + data.avoid.map(trYi).join(', ') + '.';
      }
      if (window.ToolShare) {
        window.ToolShare.render('zodiac-share', {
          label: isEn ? 'Share Your Horoscope' : '分享你的运势',
          text: shareText
        });
      }

      // ── 渲染 FAQ 模块 ──
      var faqSignNameEl = document.getElementById('faqSignName');
      if (faqSignNameEl) faqSignNameEl.textContent = isEn ? SIGN_NAMES_EN[sign] : meta.name;

      // FAQ 数据模板（基于当日 fortune 数据填充）
      var faqData;
      if (isEn) {
        faqData = [
          {
            q: 'How is ' + SIGN_NAMES_EN[sign] + '\'s horoscope today?',
            a: 'Today\'s energy for ' + SIGN_NAMES_EN[sign] + ' is ' + (VERDICT_EN[verdict]||verdict).toLowerCase() + ', with an overall score of ' + data.score + '/100. Lucky number: ' + data.number + ', direction: ' + (DIRECTION_EN[data.direction]||data.direction) + ', lucky color: ' + (COLOR_EN[data.colorName]||data.colorName) + '. Good for ' + data.good.map(trYi).join(', ') + ', avoid ' + data.avoid.map(trYi).join(', ') + '.'
          },
          {
            q: 'How is ' + SIGN_NAMES_EN[sign] + '\'s career luck today?',
            a: 'Based on the Chinese zodiac analysis, ' + SIGN_NAMES_EN[sign] + '\'s work energy today: ' + (VERDICT_DESC_EN[verdict]||'') + ' Best approach: ' + (data.good[0] ? trYi(data.good[0]) + ' is favored today.' : 'stay focused on routine tasks.') + '.'
          },
          {
            q: 'How is ' + SIGN_NAMES_EN[sign] + '\'s love and money luck today?',
            a: 'The overall energy for ' + SIGN_NAMES_EN[sign] + ' today is ' + (VERDICT_EN[verdict]||verdict).toLowerCase() + '. Detailed reading above. Key advice: "' + trQuote(data.quote) + '". Lucky number ' + data.number + ' and direction ' + (DIRECTION_EN[data.direction]||data.direction) + ' can enhance your day.'
          }
        ];
      } else {
        var verdictMapCN = {
          '上升': '运势上升',
          '降低': '运势降低',
          '一般': '运势一般',
          '喜忧参半': '喜忧参半',
          '稳定': '运势稳定',
        };
        faqData = [
          {
            q: meta.name + '今日运势如何？',
            a: meta.name + '今日运势' + (verdictMapCN[verdict] || verdict) + '，综合评分 ' + data.score + '/100。幸运数字 ' + data.number + '，幸运方位 ' + data.direction + '，幸运色 ' + data.colorName + '。宜' + data.good.join('、') + '，忌' + data.avoid.join('、') + '。'
          },
          {
            q: meta.name + '今日事业工作运势好吗？',
            a: '根据天干地支五行推算，今日' + meta.name + '的工作运势' + (verdict === '上升' ? '受吉星扶助，适合主动出击' : verdict === '降低' ? '不利因素较多，宜静不宜动' : '平稳推进，按计划行事') + '。建议' + (data.good[0] ? '今日宜' + data.good[0] : '保持专注') + '。'
          },
          {
            q: meta.name + '今日财运/爱情运势如何？',
            a: '今日' + meta.name + '的整体能量' + (verdictMapCN[verdict] || verdict) + '，具体运势详见上方详细解读。综合建议：' + data.quote + '。配合幸运数字 ' + data.number + ' 和幸运方位 ' + data.direction + ' 行动，效果更佳。'
          }
        ];
      }

      // JSON-LD Schema
      var jsonLd = {
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        'mainEntity': faqData.map(function(f) {
          return {
            '@type': 'Question',
            'name': f.q,
            'acceptedAnswer': {
              '@type': 'Answer',
              'text': f.a
            }
          };
        })
      };
      var ldEl = document.getElementById('faqJsonLd');
      if (ldEl) ldEl.textContent = JSON.stringify(jsonLd);

      // 可见 FAQ 内容
      var faqListEl = document.getElementById('faqList');
      if (faqListEl) {
        var html = '';
        faqData.forEach(function(faq) {
          html += '<details class="faq-item">' +
            '<summary class="faq-item__q">' + faq.q + '</summary>' +
            '<div class="faq-item__a">' + faq.a + '</div>' +
          '</details>';
        });
        faqListEl.innerHTML = html;
      }

      // ── 渲染博客导流（根据页面语言自动切换中英文）──
      var blogLinks = isEn ? (data.blogLinksEN || []) : (data.blogLinksCN || []);
      var blogLinksEl = document.getElementById('blogLinksList');
      if (blogLinksEl && blogLinks.length > 0) {
        var blogHtml = '';
        blogLinks.forEach(function(link) {
          blogHtml += '<a href="' + link.url + '" class="blog-link-card">' +
            '<div class="blog-link-card__icon">📖</div>' +
            '<div class="blog-link-card__content">' +
              '<div class="blog-link-card__title">' + link.title + '</div>' +
              '<div class="blog-link-card__arrow">→</div>' +
            '</div>' +
          '</a>';
        });
        blogLinksEl.innerHTML = blogHtml;
        var blogSection = document.getElementById('blogLinksSection');
        if (blogSection) blogSection.style.display = 'block';
      } else if (blogLinksEl) {
        var blogSection = document.getElementById('blogLinksSection');
        if (blogSection) blogSection.style.display = 'none';
      }

      // ── 切换静态文本（英文模式）──
      if (isEn) {
        document.getElementById('backLink').textContent = '← Back to Horoscopes';
        document.getElementById('dividerText').textContent = 'Daily Horoscope Reading';
        document.getElementById('seoTitle').innerHTML = 'Today\'s ' + SIGN_NAMES_EN[sign] + ' Horoscope';
        document.getElementById('seoText').textContent = 'Loading today\'s horoscope reading...';
        document.getElementById('faqTitle').textContent = 'Frequently Asked Questions';
        document.getElementById('faqSubtitle').innerHTML = 'Common questions about ' + SIGN_NAMES_EN[sign] + '\'s horoscope today';
        document.getElementById('blogTitle').textContent = 'Related Reading';
        document.getElementById('blogSubtitle').textContent = 'Explore more Chinese astrology insights';
      }

      // ── 加载SEO解读内容 ──
      fetch('seo-content/' + dateStr + '.json')
        .then(function(r) { return r.json(); })
        .then(function(json) {
          var fc = json.fortunes && json.fortunes[sign];
          if (fc) {
            var content = (isEn && fc.contentEN) ? fc.contentEN : fc.content;
            if (content) {
              document.getElementById('seoText').textContent = content;
            }
          }
        })
        .catch(function() { /* 静默失败，保留占位文本 */ });
      // 渲染语言切换按钮
      var langSwitchEl = document.getElementById('langSwitch');
      if (langSwitchEl) {
        langSwitchEl.innerHTML = 
          '<a href="javascript:void(0)" onclick="switchLang(\'zh\')" style="color:' + (pageLang==='zh'?'#D4AF37':'rgba(255,255,255,0.5)') + ';text-decoration:none;margin-right:12px;font-size:0.85rem;font-weight:' + (pageLang==='zh'?'600':'400') + ';">中</a>' +
          '<a href="javascript:void(0)" onclick="switchLang(\'en\')" style="color:' + (pageLang==='en'?'#D4AF37':'rgba(255,255,255,0.5)') + ';text-decoration:none;font-size:0.85rem;font-weight:' + (pageLang==='en'?'600':'400') + ';">EN</a>';
      }
    })();

    window.switchLang = function(lang) {
      localStorage.setItem('daoessence_lang', lang);
      var url = new URL(location.href);
      url.searchParams.set('lang', lang);
      location.href = url.toString();
    };
  </script>

</body>
</html>
