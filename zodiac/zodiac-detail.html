      document.getElementById('seoSignName').textContent = isEn ? SIGN_NAMES_EN[sign] : meta.name;

      // 分享栏（统一使用 tool-share.js）
      var shareText = meta.name + '今日运势 ' + data.score + '分 — ' + trQuote(data.quote);
      if (isEn) {
        shareText = 'Today\'s ' + (SIGN_NAMES_EN[sign] || sign) + ' Chinese zodiac horoscope: ' + data.score + '/100. Lucky number ' + data.number + ', direction ' + (DIRECTION_EN[data.direction]||data.direction) + ', lucky color ' + (COLOR_EN[data.colorName]||data.colorName) + '. Good for ' + data.good.map(trYi).join(', ') + '. Avoid ' + data.avoid.map(trYi).join(', ') + '.';
      }
      if (window.ToolShare) {
        window.ToolShare.render('zodiac-share', {
          label: isEn ? 'Share Your Horoscope' : '分享你的运势',
          sign: sign,
          data: {
            score: data.score,
            number: data.number,
            colorName: isEn ? (COLOR_EN[data.colorName] || data.colorName) : data.colorName,
            direction: isEn ? (DIRECTION_EN[data.direction] || data.direction) : data.direction,
            quote: trQuote(data.quote)
          },
          text: shareText
        });
      }

      // ── 渲染 FAQ 模块 ──
      var faqSignNameEl = document.getElementById('faqSignName');
      if (faqSignNameEl) faqSignNameEl.textContent = isEn ? SIGN_NAMES_EN[sign] : meta.name;

      // FAQ 数据模板（基于当日 fortune 数据填充）
      var faqData;
      if (isEn) {
        faqData = [
          {
            q: 'How is ' + SIGN_NAMES_EN[sign] + '\'s horoscope today?',
            a: 'Today\'s energy for ' + SIGN_NAMES_EN[sign] + ' is ' + (VERDICT_EN[verdict]||verdict).toLowerCase() + ', with an overall score of ' + data.score + '/100. Lucky number: ' + data.number + ', direction: ' + (DIRECTION_EN[data.direction]||data.direction) + ', lucky color: ' + (COLOR_EN[data.colorName]||data.colorName) + '. Good for ' + data.good.map(trYi).join(', ') + ', avoid ' + data.avoid.map(trYi).join(', ') + '.'
          },
          {
            q: 'How is ' + SIGN_NAMES_EN[sign] + '\'s career luck today?',
            a: 'Based on the Chinese zodiac analysis, ' + SIGN_NAMES_EN[sign] + '\'s work energy today: ' + (VERDICT_DESC_EN[verdict]||'') + ' Best approach: ' + (data.good[0] ? trYi(data.good[0]) + ' is favored today.' : 'stay focused on routine tasks.') + '.'
          },
          {
            q: 'How is ' + SIGN_NAMES_EN[sign] + '\'s love and money luck today?',
            a: 'The overall energy for ' + SIGN_NAMES_EN[sign] + ' today is ' + (VERDICT_EN[verdict]||verdict).toLowerCase() + '. Detailed reading above. Key advice: "' + trQuote(data.quote) + '". Lucky number ' + data.number + ' and direction ' + (DIRECTION_EN[data.direction]||data.direction) + ' can enhance your day.'
          }
        ];
      } else {
        var verdictMapCN = {
          '上升': '运势上升',
          '降低': '运势降低',
          '一般': '运势一般',
          '喜忧参半': '喜忧参半',
          '稳定': '运势稳定',
        };
        faqData = [
          {
            q: meta.name + '今日运势如何？',
            a: meta.name + '今日运势' + (verdictMapCN[verdict] || verdict) + '，综合评分 ' + data.score + '/100。幸运数字 ' + data.number + '，幸运方位 ' + data.direction + '，幸运色 ' + data.colorName + '。宜' + data.good.join('、') + '，忌' + data.avoid.join('、') + '。'
          },
          {
            q: meta.name + '今日事业工作运势好吗？',
            a: '根据天干地支五行推算，今日' + meta.name + '的工作运势' + (verdict === '上升' ? '受吉星扶助，适合主动出击' : verdict === '降低' ? '不利因素较多，宜静不宜动' : '平稳推进，按计划行事') + '。建议' + (data.good[0] ? '今日宜' + data.good[0] : '保持专注') + '。'
          },
          {
            q: meta.name + '今日财运/爱情运势如何？',
            a: '今日' + meta.name + '的整体能量' + (verdictMapCN[verdict] || verdict) + '，具体运势详见上方详细解读。综合建议：' + data.quote + '。配合幸运数字 ' + data.number + ' 和幸运方位 ' + data.direction + ' 行动，效果更佳。'
          }
        ];
      }

      // JSON-LD Schema
      var jsonLd = {
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        'mainEntity': faqData.map(function(f) {
          return {
            '@type': 'Question',
            'name': f.q,
            'acceptedAnswer': {
              '@type': 'Answer',
              'text': f.a
            }
          };
        })
      };
      var ldEl = document.getElementById('faqJsonLd');
      if (ldEl) ldEl.textContent = JSON.stringify(jsonLd);

      // 可见 FAQ 内容
      var faqListEl = document.getElementById('faqList');
      if (faqListEl) {
        var html = '';
        faqData.forEach(function(faq) {
          html += '<details class="faq-item">' +
            '<summary class="faq-item__q">' + faq.q + '</summary>' +
            '<div class="faq-item__a">' + faq.a + '</div>' +
          '</details>';
        });
        faqListEl.innerHTML = html;
      }

      // ── 渲染博客导流（根据页面语言自动切换中英文）──
      var blogLinks = isEn ? (data.blogLinksEN || []) : (data.blogLinksCN || []);
      var blogLinksEl = document.getElementById('blogLinksList');
      if (blogLinksEl && blogLinks.length > 0) {
        var blogHtml = '';
        blogLinks.forEach(function(link) {
          blogHtml += '<a href="' + link.url + '" class="blog-link-card">' +
            '<div class="blog-link-card__icon">📖</div>' +
            '<div class="blog-link-card__content">' +
              '<div class="blog-link-card__title">' + link.title + '</div>' +
              '<div class="blog-link-card__arrow">→</div>' +
            '</div>' +
          '</a>';
        });
        blogLinksEl.innerHTML = blogHtml;
        var blogSection = document.getElementById('blogLinksSection');
        if (blogSection) blogSection.style.display = 'block';
      } else if (blogLinksEl) {
        var blogSection = document.getElementById('blogLinksSection');
        if (blogSection) blogSection.style.display = 'none';
      }

      // ── 切换静态文本（英文模式）──
      if (isEn) {
        document.getElementById('backLink').textContent = '← Back to Horoscopes';
        document.getElementById('dividerText').textContent = 'Daily Horoscope Reading';
        document.getElementById('seoTitle').innerHTML = 'Today\'s ' + SIGN_NAMES_EN[sign] + ' Horoscope';
        document.getElementById('seoText').textContent = 'Loading today\'s horoscope reading...';
        document.getElementById('faqTitle').textContent = 'Frequently Asked Questions';
        document.getElementById('faqSubtitle').innerHTML = 'Common questions about ' + SIGN_NAMES_EN[sign] + '\'s horoscope today';
        document.getElementById('blogTitle').textContent = 'Related Reading';
        document.getElementById('blogSubtitle').textContent = 'Explore more Chinese astrology insights';
      }

      // ── 加载SEO解读内容 ──
      fetch('/zodiac/seo-content/' + dateStr + '.json')
        .then(function(r) { return r.json(); })
        .then(function(json) {
          var fe = isEn ? (json.fortunesEn && json.fortunesEn[sign]) : (json.fortunes && json.fortunes[sign]);
          if (fe && fe.content) {
            document.getElementById('seoText').textContent = fe.content;
          }
        })
        .catch(function() { /* 静默失败，保留占位文本 */ });
      // 渲染语言切换按钮
      var langSwitchEl = document.getElementById('langSwitch');
      if (langSwitchEl) {
        langSwitchEl.innerHTML = 
          '<a href="javascript:void(0)" onclick="switchLang(\'zh\')" style="color:' + (pageLang==='zh'?'#D4AF37':'rgba(255,255,255,0.5)') + ';text-decoration:none;margin-right:12px;font-size:0.85rem;font-weight:' + (pageLang==='zh'?'600':'400') + ';">中</a>' +
          '<a href="javascript:void(0)" onclick="switchLang(\'en\')" style="color:' + (pageLang==='en'?'#D4AF37':'rgba(255,255,255,0.5)') + ';text-decoration:none;font-size:0.85rem;font-weight:' + (pageLang==='en'?'600':'400') + ';">EN</a>';
      }
    })();

    window.switchLang = function(lang) {
      localStorage.setItem('daoessence_lang', lang);
      var url = new URL(location.href);
      url.searchParams.set('lang', lang);
      location.href = url.toString();
    };
  </script>

</body>
</html>
